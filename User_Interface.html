<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberbullying Text Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
      width: 400px;
      max-width: 90%;
    }
    h1 {
      font-size: 24px;
      margin-top: 0;
      text-align: center;
    }
    p {
      margin: 10px 0;
    }
    textarea {
      width: calc(100% - 40px);
      height: 150px;
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      resize: none;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #0056b3;
    }
    #result {
      margin-top: 20px;
      text-align: center;
    }
    .loading {
      display: none;
      width: 40px;
      height: 40px;
      margin: 0 auto;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top-color: #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cyberbullying Text Analyzer</h1>
    <p>Enter a tweet to analyze:</p>
    <textarea id="tweetInput" placeholder="Type your tweet here..."></textarea>
    <button onclick="analyzeTweet()">Analyze</button>
    <div id="result"></div>
    <div class="loading" id="loading"></div>
  </div>

  <script>
    function analyzeTweet() {
      var tweet = document.getElementById('tweetInput').value;
      var loading = document.getElementById('loading');
      var resultDiv = document.getElementById('result');
      
      // Show loading animation
      loading.style.display = 'block';
    
      setTimeout(function() {
        // Here implement cyberbullying analysis algorithm
        var isCyberbullying = Math.random() < 0.5; 
        resultDiv.innerHTML = isCyberbullying ? '<p>This tweet contains cyberbullying.</p>' : '<p>This tweet does not contain cyberbullying.</p>';
        
        loading.style.display = 'none';
      }, 1500); 
    }
  </script>
</body>
</html>
